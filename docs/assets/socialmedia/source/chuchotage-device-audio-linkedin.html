<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Chuchotage Device Audio LinkedIn Image</title>
  <style>
    :root {
      --ink: #02070c;
      --ink-soft: #07131d;
      --surface: #0c1b26;
      --signal: #1d9bda;
      --signal-soft: #68c8f4;
      --cream: #f2e9dd;
      --text: #e8edf1;
      --muted: #a1adb7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .poster {
      position: relative;
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(2, 7, 12, 0.96) 0%, rgba(2, 7, 12, 0.82) 37%, rgba(2, 7, 12, 0.18) 70%, rgba(2, 7, 12, 0.58) 100%),
        linear-gradient(180deg, rgba(2, 7, 12, 0.08) 0%, rgba(2, 7, 12, 0.16) 52%, rgba(2, 7, 12, 0.82) 100%),
        url("../chuchotage-device-audio-linkedin-bg.png") center / cover no-repeat;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 26% 22%, rgba(29, 155, 218, 0.18), transparent 24%),
        radial-gradient(circle at 78% 78%, rgba(104, 200, 244, 0.16), transparent 28%);
      pointer-events: none;
    }

    .poster::after {
      content: "";
      position: absolute;
      left: 78px;
      right: 78px;
      bottom: 112px;
      height: 2px;
      background: linear-gradient(90deg, var(--signal), rgba(104, 200, 244, 0.25), transparent);
      box-shadow: 0 0 24px rgba(29, 155, 218, 0.55);
      opacity: 0.9;
    }

    .brand {
      position: absolute;
      top: 78px;
      left: 78px;
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text);
      font-size: 34px;
      font-weight: 500;
    }

    .mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(104, 200, 244, 0.22), 0 0 28px rgba(29, 155, 218, 0.18);
    }

    .mark svg {
      width: 46px;
      height: 46px;
    }

    .copy {
      position: absolute;
      left: 78px;
      top: 248px;
      width: 580px;
      color: var(--text);
    }

    .eyebrow {
      margin: 0 0 26px;
      color: var(--signal-soft);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 570px;
      color: var(--cream);
      font-size: 82px;
      line-height: 0.97;
      font-weight: 760;
      letter-spacing: 0;
    }

    .examples {
      position: absolute;
      left: 78px;
      bottom: 170px;
      display: grid;
      gap: 14px;
      width: 612px;
    }

    .pill {
      width: max-content;
      max-width: 612px;
      padding: 16px 22px;
      border-radius: 8px;
      border: 1px solid rgba(104, 200, 244, 0.28);
      background: rgba(7, 19, 29, 0.72);
      color: var(--text);
      font-size: 29px;
      line-height: 1.12;
      font-weight: 620;
      box-shadow: 0 0 26px rgba(29, 155, 218, 0.12);
      backdrop-filter: blur(10px);
    }

    .pill span {
      color: var(--signal-soft);
      padding-right: 10px;
    }

    .note {
      position: absolute;
      left: 78px;
      bottom: 62px;
      color: var(--muted);
      font-size: 22px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Translate whatever comes out of your device">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 35c5.6-8 11.2-8 16.8 0s11.2 8 16.8 0" stroke="#68C8F4" stroke-width="5" stroke-linecap="round"/>
          <path d="M22 15v34M32 9v46M42 15v34" stroke="#F2E9DD" stroke-width="4" stroke-linecap="round"/>
          <path d="M15 35c5.6-8 11.2-8 16.8 0s11.2 8 16.8 0" stroke="#1D9BDA" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>chuchotage.ai</div>
    </div>

    <section class="copy">
      <p class="eyebrow">Device audio</p>
      <h1>Translate whatever comes out of your device.</h1>
    </section>

    <section class="examples" aria-label="Examples">
      <div class="pill"><span>01</span>Zoom meetings</div>
      <div class="pill"><span>02</span>WhatsApp audios</div>
      <div class="pill"><span>03</span>YouTube videos</div>
    </section>

    <div class="note">Not just the person in front of your microphone.</div>
  </main>
</body>
</html>
