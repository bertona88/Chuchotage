    <script>
      (() => {
        const APP_STORE_URL = "https://apps.apple.com/it/app/chuchotage/id6770434335";
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.andreabertoncini.chuchotage";

        function pickStoreTarget() {
          const userAgent = (navigator.userAgent || "").toLowerCase();
          const userAgentPlatform = navigator.userAgentData && navigator.userAgentData.platform
            ? navigator.userAgentData.platform
            : "";
          const platform = `${navigator.platform || ""} ${userAgentPlatform}`.toLowerCase();
          const isAndroid = userAgent.includes("android") || platform.includes("android");
          const isTouchIpad = userAgent.includes("macintosh") && navigator.maxTouchPoints > 1;
          const isAppleMobile = /iphone|ipad|ipod/.test(userAgent) || isTouchIpad;

          if (isAndroid) {
            return { label: "Google Play", url: PLAY_STORE_URL };
          }

          if (isAppleMobile) {
            return { label: "the App Store", url: APP_STORE_URL };
          }

          return null;
        }

        function openDetectedStore() {
          const status = document.querySelector("[data-redirect-status]");
          const target = pickStoreTarget();

          if (!target) {
            if (status) {
              status.textContent = "Choose your store.";
            }
            return;
          }

          if (status) {
            status.textContent = `Opening ${target.label}...`;
          }

          window.setTimeout(() => {
            window.location.replace(target.url);
          }, 250);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", openDetectedStore);
        } else {
          openDetectedStore();
        }
      })();
    </script>
