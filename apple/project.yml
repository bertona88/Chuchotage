name: ChuchotageApple

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.2"

settings:
  base:
    CURRENT_PROJECT_VERSION: 9
    MARKETING_VERSION: 0.1.1
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic

targets:
  Chuchotage iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chuchotage
        excludes:
          - Resources/MacOSInfo.plist
          - Resources/MacOSEntitlements.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreabertoncini.chuchotage
        PRODUCT_NAME: Chuchotage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Chuchotage/Resources/iOSInfo.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  Chuchotage macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Chuchotage
        excludes:
          - Resources/iOSInfo.plist
          - Resources/MacOSEntitlements.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreabertoncini.chuchotage
        PRODUCT_NAME: Chuchotage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Chuchotage/Resources/MacOSInfo.plist
        CODE_SIGN_ENTITLEMENTS: Chuchotage/Resources/MacOSEntitlements.plist
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  Chuchotage Shared Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: ChuchotageTests
    dependencies:
      - target: Chuchotage macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreabertoncini.chuchotage.shared-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chuchotage.app/Contents/MacOS/Chuchotage"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Chuchotage iOS:
    build:
      targets:
        Chuchotage iOS: all
    run:
      config: Debug

  Chuchotage macOS:
    build:
      targets:
        Chuchotage macOS: all
        Chuchotage Shared Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Chuchotage Shared Tests
